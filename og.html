<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic Sounds</title>
    <meta name="title" content="Cosmic Sounds" />
    <meta
      name="description"
      content="Launch a galaxy of out-of-context sounds. Crafted for quick chaos by 48Okqy."
    />
    <meta name="robots" content="index, follow" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/spinner.css" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="img/mlg-favicon.png" />
    <link rel="shortcut icon" href="img/mlg-favicon.png" type="image/x-icon" />
    <link rel="apple-touch-icon" href="img/mlg-favicon.png" type="image/x-icon" />
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/sw.js")
          .then((registration) => {
            console.log("Service worker registered:", registration);
          })
          .catch((error) => {
            console.log("Service worker registration failed:", error);
          });
      }
    </script>
  </head>
  <body>
    <div class="cosmic-grid"></div>
    <header class="hero">
      <div class="hero__badge">48Okqy</div>
      <div class="hero__text">
        <p class="eyebrow">Online soundboard</p>
        <h1>Cosmic Sounds</h1>
        <p class="lede">Tap the nebula buttons and unleash stardust-level chaos.</p>
        <div class="hero__actions">
          <a class="btn" href="https://forms.gle/hoiTBEZ4p14iupXH6" target="_blank" rel="noreferrer">Submit a sound</a>
          <div class="control">
            <span class="control__label">Audio control</span>
            <div class="control__actions">
              <button class="ghost" onclick="javascript:playAll()">Play galaxy</button>
              <button class="ghost" onclick="javascript:stopAll()">Silence</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="soundboard">
      <div class="soundboard__header">
        <p class="label">Live deck</p>
        <div class="hint">Sounds appear below once loaded.</div>
      </div>
      <div class="soundboard-container">
        <div class="flex-container">
          <div class="spinner"></div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>Cosmic Sounds by 48Okqy</p>
    </footer>

    <script type="application/javascript" src="loader.js"></script>
  </body>
</html>
